<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Fight</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f14; color: #e8eef5; font-family: system-ui, sans-serif; overflow: hidden; overscroll-behavior: none; }
    #game { position: fixed; inset: 0; }
    #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; background: #0b0f14; z-index: 10; }
    #menu h1 { margin: 0 0 8px; font-size: 40px; letter-spacing: 2px; }
    #menu input, #menu button { font-size: 18px; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a3544; background: #151c26; color: inherit; width: min(320px, 100%); box-sizing: border-box; }
    #menu button { background: #2f6fed; border-color: #2f6fed; font-weight: 600; cursor: pointer; }
    #menu button.alt { background: #1e8e5a; border-color: #1e8e5a; }
    #menu small { color: #8795a8; max-width: 320px; text-align: center; }
    #labels { position: fixed; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
    .lbl { position: absolute; left: 0; top: 0; font-size: 12px; text-align: center; text-shadow: 0 1px 2px #000; white-space: nowrap; }
    .lbl i { display: block; width: 44px; height: 5px; margin: 2px auto 0; background: #000a; border-radius: 3px; overflow: hidden; }
    .lbl b { display: block; height: 100%; background: #3ddc84; }
    #hud { position: fixed; left: 10px; top: 10px; z-index: 4; font: 14px/1.4 ui-monospace, monospace; background: #0008; padding: 6px 10px; border-radius: 6px; pointer-events: none; }
    #topbar { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 14px; font: 600 18px ui-monospace, monospace; background: #000a; padding: 6px 16px; border-radius: 8px; pointer-events: none; white-space: nowrap; }
    #topbar .ct { color: #7db4ff; } #topbar .t { color: #ffb15e; } #topbar .tm { min-width: 150px; text-align: center; font-size: 15px; }
    #banner { position: fixed; left: 50%; top: 22%; transform: translateX(-50%); z-index: 4; text-align: center; pointer-events: none; text-shadow: 0 2px 8px #000; }
    #banner .big { font-size: 44px; font-weight: 800; letter-spacing: 2px; } #banner .sub { font-size: 18px; margin-top: 4px; }
    #bar { width: 260px; height: 10px; margin: 8px auto 0; background: #000a; border-radius: 5px; overflow: hidden; display: none; } #bar b { display: block; height: 100%; width: 0; background: #ffd34d; }
    #buy { position: fixed; left: 50%; bottom: 8%; transform: translateX(-50%); z-index: 4; display: none; background: #0b0f14ee; border: 1px solid #2a3544; border-radius: 12px; padding: 12px 14px; text-align: center; }
    #buy h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; } #buy .row { display: flex; gap: 8px; }
    #buygrid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    #buygrid .grp { display: flex; flex-direction: column; gap: 5px; min-width: 108px; }
    #buygrid h4 { margin: 0 0 2px; font-size: 11px; letter-spacing: 1px; color: #8795a8; text-transform: uppercase; }
    #buy button small { display: block; color: #9fb0c4; font-size: 12px; }
    #buy button { font: 14px system-ui; color: #e8eef5; background: #1c2735; border: 1px solid #2f3d52; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    #buy button:hover:not(:disabled) { background: #2f6fed; } #buy button:disabled { opacity: .4; cursor: default; }
    .lbl.ct span { color: #8fc0ff; } .lbl.t span { color: #ffbe73; }
    #hurt { position: fixed; inset: 0; z-index: 3; pointer-events: none; box-shadow: inset 0 0 160px 40px #e02020; opacity: 0; transition: opacity .35s ease-out; }
    #skins { display: flex; gap: 8px; }
    .skin { width: 64px; height: 92px; border-radius: 10px; border: 2px solid #2a3544; background: #1f2a38 center / auto 130% no-repeat; cursor: pointer; }
    .skin.sel { border-color: #3ddc84; box-shadow: 0 0 0 2px #3ddc8466; }
    #menu button.ghost { background: #151c26; border-color: #2a3544; font-weight: 500; }
    #profile { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; background: #000b; padding: 16px; box-sizing: border-box; }
    #profile .card { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: #10161f; border: 1px solid #2a3544; border-radius: 14px; padding: 18px 20px; }
    #profile h2 { margin: 0 0 4px; } #profile h3 { margin: 16px 0 6px; font-size: 13px; letter-spacing: 1px; color: #8795a8; text-transform: uppercase; }
    #profile .stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 15px; } #profile .stats b { font-size: 20px; display: block; }
    #profile table { width: 100%; border-collapse: collapse; font-size: 14px; } #profile td, #profile th { padding: 5px 6px; text-align: left; border-bottom: 1px solid #1f2a38; }
    #profile .w { color: #3ddc84; font-weight: 700; } #profile .l { color: #ff6b6b; font-weight: 700; }
    #profile button { font: 600 15px system-ui; padding: 10px 14px; border-radius: 10px; border: 1px solid #2f6fed; background: #2f6fed; color: #e8eef5; cursor: pointer; }
    #profile button.ghost { background: #151c26; border-color: #2a3544; font-weight: 500; }
    #profile .row { display: flex; gap: 10px; margin-top: 14px; } #profile .row button { flex: 1; width: auto; }
    #wbar { position: fixed; left: 10px; bottom: 14px; z-index: 4; display: flex; gap: 6px; }
    #wbar button { font: 13px system-ui; color: #e8eef5; background: #0b0f14cc; border: 1px solid #2f3d52; border-radius: 8px; padding: 6px 10px; cursor: pointer; text-align: left; min-width: 74px; }
    #wbar button b { display: block; font: 11px ui-monospace, monospace; color: #8795a8; }
    #wbar button.off { opacity: .35; cursor: default; } #wbar button.cur { border-color: #3ddc84; background: #1b3a2c; }
    #teams { display: flex; gap: 8px; width: min(320px, 100%); }
    .chip { flex: 1; text-align: center; padding: 9px 6px; border-radius: 10px; border: 2px solid #2a3544; background: #151c26; cursor: pointer; font-size: 14px; line-height: 1.25; }
    .chip small { display: block; color: #8795a8; font-size: 11px; }
    .chip.sel { border-color: #3ddc84; box-shadow: 0 0 0 2px #3ddc8455; }
    .chip.ct { border-bottom-color: #3f8cff; } .chip.t { border-bottom-color: #e08a2c; }
    #toast { position: fixed; left: 50%; top: 34%; transform: translateX(-50%); z-index: 6; pointer-events: none; font: 800 30px system-ui, sans-serif; color: #7dff9c; text-shadow: 0 2px 10px #000; opacity: 0; }
    #toast.show { animation: pop 1.1s ease-out forwards; }
    @keyframes pop { 0% { opacity: 0; transform: translate(-50%, 10px) scale(.8); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -40px) scale(1); } }
    #coins { color: #ffd34d; font: 700 15px ui-monospace, monospace; }
    #touch { position: fixed; inset: 0; z-index: 5; display: none; touch-action: none; }
    .stick { position: absolute; bottom: 8%; width: 130px; height: 130px; border-radius: 50%; border: 2px solid #ffffff40; background: #ffffff12; }
    .stick.left { left: 6%; } .stick.right { right: 6%; }
    .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffff55; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="labels"></div>
  <div id="hurt"></div>
  <div id="toast"></div>
  <div id="hud"></div>
  <div id="wbar"></div>
  <div id="topbar"><span class="ct" id="ctw"></span><span class="tm" id="tm"></span><span class="t" id="tw"></span></div>
  <div id="banner"><div class="big" id="bigtxt"></div><div class="sub" id="subtxt"></div><div id="bar"><b></b></div></div>
  <div id="buy"><h3>BUY &mdash; <span id="buytime"></span></h3><div id="buygrid"></div></div>
  <div id="touch">
    <div class="stick left" id="stickL"><div class="knob" id="knobL"></div></div>
    <div class="stick right" id="stickR"><div class="knob" id="knobR"></div></div>
  </div>
  <div id="profile"><div class="card">
    <h2 id="pname"></h2><div class="stats" id="pstats"></div>
    <h3>Costume</h3><div id="pskin"></div>
    <h3>Last weapon pack</h3><div id="ppack"></div>
    <h3>Recent fights</h3><div id="phist"></div>
    <div class="row"><button id="pclear" class="ghost">Clear history</button><button id="pclose">Close</button></div>
  </div></div>
  <div id="menu">
    <h1>FIGHT</h1>
    <div id="coins"></div>
    <input id="name" maxlength="14" placeholder="Your name" />
    <div id="skins" title="Choose your costume"></div>
    <div id="teams" title="Choose your team"></div>
    <button id="single">Single player (vs bots)</button>
    <input id="room" maxlength="16" placeholder="Room code (blank = public)" />
    <button id="multi" class="alt">Multiplayer</button>
    <button id="profileBtn" class="ghost">Profile &amp; recent fights</button>
    <small>Desktop: WASD move, mouse aim, click shoot, hold E plant/defuse, click the buy menu (V = armor, B = rebuy), 1 sidearm / 2 primary / wheel / Q switch weapon, M mute. Mobile: left stick moves, right stick aims and shoots.</small>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
