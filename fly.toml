# Fly.io settings for the multiplayer game server (see README, "Putting multiplayer online").
# `app` must match the app created on Fly (names are global).
app = "game-fighting-1"
primary_region = "sin"          # Singapore, the closest Fly region to Sri Lanka ("bom" / Mumbai is not available for new apps)

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true            # players connect with wss:// (secure WebSocket) on port 443
  auto_stop_machines = "off"    # keep it running so a game is always available
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
